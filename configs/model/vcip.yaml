# @package _global_
# Temporary config name inherited from the original VCIP codebase. This file now
# describes the one-stage local/global CT+IQL EM method used in our Tumor runs.
model:
  name: VCIP
  inference:
    _target_: src.models.inference_model.InferenceModel

exp:
  seed: 10
  batch_size: 1024
  batch_size_val: 128
  dropout: 0.0
  tau: 6
  log_config: false
  use_mlflow: true
  mlflow_experiment: vcip_tumor_one_step
  mlflow_uri: http://127.0.0.1:5000
  mlflow_log_artifacts: true
  mlflow_combo_id: ''
