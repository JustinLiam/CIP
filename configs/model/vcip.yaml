# @package _global_
model:
  _target_: src.models.vae_model.VAEModel
  name: VCIP
  z_dim: 16
  auxiliary:
    _target_: src.models.auxiliary_model.AuxiliaryModel
    hidden_dim: 16
    num_layers: 2
    hiddens_G_y:
    - 16
    - 16
    hiddens_G_x:
    - 16
    - 16
    lr: 0.001
  inference:
    _target_: src.models.inference_model.InferenceModel
    hidden_dim: 16
    num_layers: 2
    # Local-global CTHistoryEncoder switch. Keep default 0 to preserve current CT
    # unless an experiment explicitly enables low-layer causal depthwise Conv1d.
    local_conv_layers: 0
    local_conv_kernel_size: 6
    local_conv_dilation: 1
    hiddens_F_mu:
    - 16
    # - 16
    hiddens_F_logvar:
    - 16
    # - 16
    predict_y_history:
    - 16
    # - 16
    do: True
  generative:
    _target_: src.models.generative_model.GenerativeModel
    entropy_lambda: 1
    hidden_dim: 16
    treatment_hidden_dim: 16
    num_layers: 2
    hiddens_F_mu:
    - 16
    # - 16
    hiddens_F_logvar:
    - 16
    # - 16
    hiddens_decoder:
    - 16
    # - 16
    hidden_action_decoder:
    - 16
    # - 16
    hidden_action_decoder_step:
    - 16
    # - 16
  lr: 0.001
exp:
  seed: 10
  batch_size: 512
  batch_size_val: 128
  num_samples: 10
  dropout: 0.2
  epochs: 100
  patience: 20
  lr: 0.01
  weight_decay: 1.0e-05
  lambda_X: 0.1
  lambda_Y: 1
  load_best: true
  val: true
  weights_ema: true
  tau: 12
  repeats: 10
  lambda_step: 0.1
  lambda_kl: 1
  lambda_reg: 1
  lambda_action: 1
  lambda_hy: 1
  beta_bound: -10
  # IQL planner (train_iql_planner.py) — declared so Hydra struct mode allows overrides without +exp.*
  iql_updates: 5000
  iql_batch_size: 256
  iql_max_patients: null
  # Path to train_ct ``ct_best_encoder.pt``, VAE ``model.ckpt`` (inference_model.*), or flat InferenceModel weights
  iql_inference_ckpt: ""
  # Reward design for offline RL transitions (see iql_dataset_builder.py docstring).
  #   negative_outcome      : r = -|y_{t+1} - y_target|                (L1, RECOMMENDED)
  #   negative_outcome_mse  : r = -(y_{t+1} - y_target)^2              (L2, heavy-tailed!)
  #   progress              : r = |y_t - y_target| - |y_{t+1} - y_target|
  #     NOTE: "progress" was tried as a long-horizon signal but empirically
  #     collapses V/Q to ≈0 under HER-sampled y_target — mean(r)≈0 and
  #     |r|~0.01 for slow-changing tumor data, so the AWR advantage vanishes
  #     and the IQL policy degenerates to pure behavior cloning (actor_loss
  #     plateaus at the BC baseline, mae_uns stuck at the factual baseline).
  #     Also has a sign conflict: treatment that shrinks tumor pushes y_next
  #     away from the factual-future y_target → good actions get negative
  #     reward. L1 below does not have this issue.
  iql_reward_type: negative_outcome
  # Hard-clip |r| to suppress simulator-overflow outliers (raw MSE on cancer_sim
  # γ=4 has min≈-117 even though q99=0). With L1 reward the typical |r| ~ 0.3,
  # outliers |r| ~ 10; clip=3.0 kills the worst 1% without distorting 99% of the
  # learning signal. Directly eliminates the Twin-Q spike pattern (r in batch
  # → TD target jumps → q_loss ~ 0.5·r²). 0 disables.
  iql_reward_clip: 3.0
  # none | auto. "auto" divides the whole reward buffer by its empirical std
  # so TD targets stay O(1) regardless of outcome scale (standard IQL trick).
  # Recommended together with reward_clip: after clipping we re-normalize so
  # V fixed point ≈ E[r]/(1-γ) is O(10) rather than O(100).
  iql_reward_scale: auto
  iql_max_action: 1.0
  # Map dataset treatments in [0, iql_max_action] to [-iql_max_action, iql_max_action] for Tanh IQL actor
  iql_dataset_actions_unit_interval: true
  iql_hidden_dim: 256
  iql_n_hidden: 2
  # iql_tau: expectile 参数，决定“policy value”与“critic value”间的权衡。该值越高，表示算法更乐观、与 offline data 的 policy 匹配度更低、具有更强的探索性；越低则更贴近 offline data，探索性更差。一般建议 0.5~0.9 之间（参考 TD3+BC 和 IQL 论文）。
  iql_tau: 0.7  # revised in April 26, Sunday, by gridsearch in Thinkstation
  iql_beta: 2.0 # revised in April 26, Sunday, by gridsearch in Thinkstation
  iql_discount: 0.99
  # iql_target_tau: 目标网络软更新的参数，每次更新时新参数 = target_tau * 当前参数 + (1 - target_tau) * 旧目标参数。控制 Q/V/Actor 目标网络更新速度，建议 0.001 ~ 0.01 小数。
  iql_target_tau: 0.005
  iql_actor_lr: 3.0e-4
  iql_qf_lr: 3.0e-4
  iql_vf_lr: 3.0e-4
  # Periodic val MAE on train_f-side val_f during IQL training; 0 disables (last-step ckpt only).
  # Selection metric is computed on val_f only (no test_f exposure), with a fixed RNG snapshot
  # so successive checkpoints share the same eval protocol.
  iql_val_every: 200
  iql_val_batch_size: null
  # Metric to minimize for best checkpoint: mae_uns | mae_norm
  iql_val_metric: mae_uns
  # Also save final-step weights to iql_planner_last.pt when val is enabled
  iql_val_save_last: true
  # Smoothed metrics in train_iql logs: trailing mean over this many steps (default 200)
  iql_log_window: 200
  # Optional L2 grad clip per network (V, Q twin, actor); null = disabled
  iql_max_grad_norm: 5.0
  iql_deterministic: false
  iql_actor_dropout: null
  # eval_iql_planner.py: empty -> iql_models/seed_{seed}/gamma_{coeff}/iql_planner.pt
  iql_eval_ckpt: ""
  # Roll out τ steps: each step replans from CT state after appending (a_t, y_{t+1}); false = repeat first action (legacy)
  iql_eval_autoregressive: true
  # Model-based OPE A/B during IQL val:
  #   - sim:       ground-truth cancer simulator oracle (synthetic benchmark only).
  #   - predictor: learned OutcomePredictor from ct_best_encoder.pt (works on real data).
  # When >=2 worlds are listed, train_iql_planner.py tracks a separate best checkpoint
  # per world and logs Spearman rank correlation / top-K overlap / regret across worlds.
  iql_val_worlds: [sim, predictor]
  # Which world's best checkpoint becomes the primary iql_planner.pt consumed by eval_iql_planner.
  # Must appear in iql_val_worlds.
  iql_val_selection_world: predictor
  # Dump full resolved Hydra config at startup. Train scripts always log config;
  # eval_iql_planner.py only logs when this is true (default false).
  log_config: false
  # MLflow (train_ct.py, train_iql_planner.py, eval_iql_planner.py); default on.
  use_mlflow: true
  mlflow_experiment: vcip_tumor_one_step
  # Where training WRITES metrics (not the browser URL). Use file: on the training machine.
  # Example: file:/home/liam/pythonProject/VCIP-ICML-main/mlruns
  # http://... is only if you run ``mlflow server`` separately; ``mlflow ui`` is for viewing only.
  mlflow_uri: http://127.0.0.1:5000
  mlflow_log_artifacts: true
  mlflow_combo_id: ""  # optional tag for grid search / pipeline scripts
  # eval_iql_planner.py: if set, evaluate all horizons in one MLflow run (scheme 3: eval/tau{k}/mae_uns).
  iql_eval_tau_list: null
  # Horizon-aware IQL: normalize time-to-go; must match eval_iql_planner / EM raw transitions
  max_tau: 12.0
  # --- E-step WeightNet (train_ct_iql_em.py) ---
  # Align P_w(Z,A) toward P(Z)P(A). Legacy train_ct.py can still override these via CLI.
  ct_align_loss: sinkhorn
  ct_sinkhorn_blur: 0.01
  ct_weight_hidden: 64
  ct_weight_decay: 1.0e-05
  ct_batch_size: 512
  ct_num_workers: 4
  ct_k_inner: 5
  ct_w_lr: 1.0e-2
  ct_w_clip: 5.0
  # --- CT+IQL unified EM (train_ct_iql_em.py) ---
  em_outer_iters: 50
  em_m_steps_per_outer: 1000
  em_encoder_lr: 5.0e-5
  em_encoder_max_grad_norm: 1.0
  em_val_every: 2
  em_val_metric: mae_uns
  # M-step only: uniform w for first N outers; E-step always trains WeightNet.
  em_warmup_outer_iters: 8
  # CTD-style full-dataset WeightNet fit per E-step (epoch_w analogue).
  em_e_epochs: 5
  # WeightNet LR for full E-step (CTD-NKO uses 0.1 in wass_calculator.train_model).
  em_e_w_lr: 0.01
  # Refit WeightNet every N outer iters (1 = every outer); encoder/Q still update each outer.
  em_e_refresh_every: 1
  # Rebuild HER raw transitions every N outer iters (new t_target / y_target / reward).
  # 1 = refresh every outer; 0 = build once at startup only.
  em_her_refresh_every: 0
  # Number of fixed HER targets sampled for each factual (patient, t) transition
  # whenever a raw replay is built. K>1 increases replay size without changing it
  # across M-steps when em_her_refresh_every=0.
  em_her_samples_per_transition: 1
  em_log_m_every: 50
  em_ckpt_dir: null
  em_eval_ckpt: ""
  em_val_worlds: [sim]
  em_val_selection_world: sim
  # Legacy two-stage pipeline (train_ct.py / train_iql_planner.py) — override via CLI when needed.
